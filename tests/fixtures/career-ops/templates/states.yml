# Canonical states (fixture: the shape of career-ops' templates/states.yml)
states:
  - id: evaluated
    label: Evaluated
    aliases: [evaluada, hold]
  - id: applied
    label: Applied
    aliases: [aplicado, sent]
  - id: responded
    label: Responded
    aliases: [respondido]
  - id: assessment
    label: Assessment
    aliases: [screening]
  - id: interview
    label: Interview
    aliases: [entrevista]
  - id: offer
    label: Offer
    aliases: [oferta]
    terminal: true
  - id: rejected
    label: Rejected
    aliases: [rechazado]
    terminal: true
  - id: discarded
    label: Discarded
    aliases: [descartado]
    terminal: true
  - id: skip
    label: SKIP
    aliases: [no_aplicar, skip]
    terminal: true
  - id: hired
    label: Hired
    aliases: [contratado, accepted]
    terminal: true
