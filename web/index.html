<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Resume Studio</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%233d5afe'/%3E%3Cstop offset='1' stop-color='%238b5cf6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3Crect x='9' y='7' width='14' height='18' rx='2' fill='white'/%3E%3Crect x='12' y='11' width='8' height='2' rx='1' fill='%233d5afe'/%3E%3Crect x='12' y='15' width='8' height='1.5' rx='.75' fill='%23a5b4fc'/%3E%3Crect x='12' y='18.5' width='6' height='1.5' rx='.75' fill='%23a5b4fc'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true"></span>
      <span>Resume Studio</span>
    </div>
    <div class="version-switch">
      <label class="sr" for="version-select">简历版本</label>
      <select id="version-select" class="select" title="当前简历版本"></select>
      <button id="version-menu-btn" class="btn icon ghost" title="版本操作" aria-haspopup="menu"></button>
      <div id="version-menu" class="menu hidden" role="menu"></div>
    </div>
    <span class="spacer"></span>
    <span id="datapath" class="datapath" title="数据文件"></span>
    <span id="save-status" class="save-status"></span>
    <span id="conn" class="conn" title="连接状态"></span>
  </header>

  <div id="workspace" class="workspace">
    <aside class="pane left" aria-label="经历库与对话">
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" data-tab="library">经历库</button>
        <button class="tab" role="tab" data-tab="chat">对话<span id="chat-dot" class="tab-dot hidden"></span></button>
      </div>
      <div id="library" class="tabpane" role="tabpanel"></div>
      <div id="chat" class="tabpane hidden" role="tabpanel">
        <div class="chat-head">
          <select id="chat-select" class="select" title="历史对话"></select>
          <button id="chat-new" class="btn icon ghost" title="新对话"></button>
          <button id="chat-delete" class="btn icon ghost" title="删除这段对话"></button>
        </div>
        <div id="chat-log" class="chat-log"></div>
        <div class="composer">
          <div id="chat-context" class="chat-context"></div>
          <div class="composer-box">
            <textarea id="chat-input" rows="1" placeholder="和 Claude 说点什么…"></textarea>
            <button id="chat-send" class="btn icon primary" title="发送（Enter）"></button>
            <button id="chat-stop" class="btn icon danger-soft hidden" title="停止"></button>
          </div>
          <div class="composer-hint"><span>Enter 发送 · Shift+Enter 换行</span><span id="chat-model"></span></div>
        </div>
      </div>
    </aside>
    <div class="gutter" data-gutter="left" title="拖动调整宽度，双击恢复"></div>
    <main id="editor" class="pane middle" aria-label="编辑"></main>
    <div class="gutter" data-gutter="right" title="拖动调整宽度，双击恢复"></div>
    <section class="pane right" aria-label="预览">
      <div class="preview-toolbar">
        <select id="tpl-select" class="select" title="模板"></select>
        <div id="lang-seg" class="seg" title="简历语言"></div>
        <button id="layout-toggle" class="btn ghost" title="字号、边距、间距、颜色"><span class="lbl">版面</span></button>
        <span class="spacer"></span>
        <span id="page-badge" class="badge"></span>
        <div class="zoom">
          <button id="zoom-out" class="btn icon ghost" title="缩小"></button>
          <button id="zoom-fit" class="btn ghost zoom-label" title="适合宽度">适合</button>
          <button id="zoom-in" class="btn icon ghost" title="放大"></button>
        </div>
        <button id="export-btn" class="btn primary">导出 PDF</button>
      </div>
      <div id="layout-panel" class="layout-panel hidden"></div>
      <div id="render-errors" class="render-errors hidden"></div>
      <div id="canvas" class="canvas"><div id="pages" class="pages"></div></div>
    </section>
  </div>

  <div id="toast" class="toast" role="status"></div>
  <div id="modal-root"></div>
  <script src="app.js"></script>
</body>
</html>
