<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Resume Studio</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%233d5afe'/%3E%3Cstop offset='1' stop-color='%238b5cf6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3Crect x='9' y='7' width='14' height='18' rx='2' fill='white'/%3E%3Crect x='12' y='11' width='8' height='2' rx='1' fill='%233d5afe'/%3E%3Crect x='12' y='15' width='8' height='1.5' rx='.75' fill='%23a5b4fc'/%3E%3Crect x='12' y='18.5' width='6' height='1.5' rx='.75' fill='%23a5b4fc'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="chat.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true"></span>
      <span>Resume Studio</span>
    </div>
    <div id="ws-switch" class="ws-switch" role="tablist" aria-label="Workspace">
      <button class="ws-btn" role="tab" data-ws="resume" title="Resume: library, subsets and preview (Ctrl+1)"><span class="lbl" data-t>Resume</span></button>
      <button class="ws-btn" role="tab" data-ws="jobs" title="Job search: postings, pipeline, follow-ups (Ctrl+2)"><span class="lbl" data-t>Job search</span><span id="ws-jobs-dot" class="tab-dot hidden"></span></button>
      <button class="ws-btn" role="tab" data-ws="fill" title="Autofill: keep your online profiles in step with your resume (Ctrl+3)"><span class="lbl" data-t>Autofill</span></button>
    </div>
    <div class="subset-switch rs-only">
      <span id="subset-slot"></span>
      <button id="subset-menu-btn" class="btn icon ghost" title="Subset actions" aria-haspopup="menu"></button>
    </div>
    <div id="ws-tools" class="ws-tools ws-only"></div>
    <span class="spacer"></span>
    <span id="save-status" class="save-status"></span>
    <button id="settings-btn" class="btn icon ghost" title="Settings (Ctrl+,)" aria-label="Settings" aria-haspopup="dialog"></button>
  </header>
  <div id="offline" class="offline hidden" role="status"></div>

  <div id="workspace" class="workspace">
    <aside class="pane left" aria-label="Library and chat">
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" data-tab="library" data-t>Library</button>
        <button class="tab" role="tab" data-tab="jobs" data-t>Applications<span id="jobs-dot" class="tab-dot hidden"></span></button>
        <button class="tab" role="tab" data-tab="chat" data-t>Chat<span id="chat-dot" class="tab-dot hidden"></span></button>
      </div>
      <div id="library" class="tabpane" role="tabpanel"></div>
      <div id="jobs" class="tabpane hidden" role="tabpanel"></div>
      <div id="chat" class="tabpane hidden" role="tabpanel">
        <div class="chat-head">
          <span id="chat-select-slot" class="slot-grow"></span>
          <button id="chat-new" class="btn icon ghost" title="New chat"></button>
          <button id="chat-rename" class="btn icon ghost" title="Rename"></button>
          <button id="chat-delete" class="btn icon ghost" title="Delete this chat"></button>
        </div>
        <div id="chat-log" class="chat-log"></div>
        <div class="composer">
          <div id="chat-tasks" class="chat-tasks hidden"></div>
          <div id="chat-queue" class="chat-queue hidden"></div>
          <div id="chat-context" class="chat-context"></div>
          <div id="composer-box" class="composer-box">
            <div id="chat-files" class="chat-files hidden"></div>
            <div class="composer-row">
              <textarea id="chat-input" rows="1" placeholder="Ask Claude, or type / for commands"></textarea>
              <button id="chat-stop" class="btn icon danger-soft hidden" title="Stop (Claude stops after the current step)"></button>
              <button id="chat-send" class="btn icon primary" title="Send (Enter)"></button>
            </div>
            <div class="composer-bar">
              <button id="chat-attach" class="cbtn icon" title="Add images or files (you can also paste a screenshot or drop files here)"></button>
              <button id="chat-mode-btn" class="cbtn" aria-haspopup="menu"></button>
              <span class="spacer"></span>
              <button id="chat-ctx-btn" class="cbtn icon ctx" aria-haspopup="dialog"></button>
              <button id="chat-model-btn" class="cbtn" aria-haspopup="menu"></button>
              <button id="chat-effort-btn" class="cbtn" aria-haspopup="menu"></button>
            </div>
          </div>
        </div>
      </div>
    </aside>
    <div class="gutter" data-gutter="left" title="Drag to resize, double-click to reset"></div>
    <main id="editor" class="pane middle" aria-label="Editor"></main>
    <div class="gutter" data-gutter="right" title="Drag to resize, double-click to reset"></div>
    <section class="pane right" aria-label="Preview">
      <div class="preview-toolbar">
        <span id="tpl-slot"></span>
        <div id="lang-seg" class="seg" title="Resume language"></div>
        <button id="layout-toggle" class="btn ghost" title="Font size, margins, spacing, colour"><span class="lbl" data-t>Layout</span></button>
        <div class="pt-end">
          <span id="page-badge" class="badge"></span>
          <div class="zoom">
            <button id="zoom-out" class="btn icon ghost" title="Zoom out"></button>
            <button id="zoom-fit" class="btn ghost zoom-label" title="Fit width" data-t>Fit</button>
            <button id="zoom-in" class="btn icon ghost" title="Zoom in"></button>
          </div>
          <button id="export-btn" class="btn primary" data-t>Export PDF</button>
        </div>
      </div>
      <div id="layout-panel" class="layout-panel hidden"></div>
      <div id="issues" class="issues hidden"></div>
      <div id="render-errors" class="render-errors hidden"></div>
      <div id="canvas" class="canvas"><div id="pages" class="pages"></div></div>
    </section>
    <section id="jobspace" class="pane jobspace jobs-only" aria-label="Job search"></section>
    <section id="fillspace" class="pane fillspace fill-only" aria-label="Autofill"></section>
  </div>

  <div id="toast" class="toast" role="status"></div>
  <div id="modal-root"></div>
  <script src="i18n.js"></script>
  <script src="ui.js"></script>
  <script>localizeStatic();</script>
  <script src="chat.js"></script>
  <script src="jobs.js"></script>
  <script src="autofill.js"></script>
  <script src="app.js"></script>
</body>
</html>
