# Resume Studio sample data. Everything under `notes` / `evidence` is the fact
# layer: it is never rendered, it exists so the AI knows the real story.
schema_version: 2
settings:
  languages: [en, zh]
  export_dir: exports
profile:
  name: {en: Alex Chen, zh: 陈亚历}
  contacts:
    - {label: email, value: alex@example.com, url: 'mailto:alex@example.com'}
    - {label: github, value: github.com/alexchen, url: 'https://github.com/alexchen'}
    - {label: phone, value: '+61 400 000 000'}
  notes: 求职方向是 ML 工程和全栈实习，可接受远程。
sections:
  - {id: education, title: {en: Education, zh: 教育背景}, kind: timeline}
  - {id: experience, title: {en: Experience, zh: 工作经历}, kind: timeline}
  - {id: projects, title: {en: Projects, zh: 项目经历}, kind: timeline}
  - {id: skills, title: {en: Skills, zh: 专业技能}, kind: list}
entries:
  - id: EXP-001
    section: education
    title: {en: Harbour City University, zh: 海港城市大学}
    subtitle: {en: Master of Computer Science, zh: 计算机科学硕士}
    location: {en: 'Harbour City, AU', zh: 海港城}
    start: 2025-02
    end: 2026-12
    bullets:
      - {en: 'Coursework: Machine Learning, Distributed Systems, Databases, Human-Computer Interaction', zh: 主修课程：机器学习、分布式系统、数据库、人机交互}
    notes: 均分一般，别写 GPA。
  - id: EXP-002
    section: projects
    title: QuizLoom
    subtitle: {en: Solo developer, zh: 独立开发}
    tech: [Next.js, Prisma, SQLite]
    start: 2025-08
    end: present
    link: https://github.com/alexchen/quizloom
    bullets:
      - {en: 'Built a **multi-stage LLM pipeline** that turns lecture slides into practice quizzes', zh: 搭建**多阶段大模型流水线**，把课件自动转成练习题}
      - {en: 'Designed a review UI so users can edit every generated question before export', zh: 设计审阅界面，用户可在导出前逐题修改生成内容}
    notes: |
      导出功能是同组同学写的，我负责流程设计和 prompt 拆分。
      用户只有三十多个同学，没有付费用户。
    evidence: []
  - id: EXP-003
    section: projects
    title: {en: Plant Disease Classifier, zh: 植物病害图像分类}
    subtitle: {en: Course project, zh: 课程项目}
    tech: [PyTorch]
    start: 2025-09
    end: 2025-10
    bullets:
      - {en: 'Compared 4 augmentation strategies; a fine-tuned ResNet reached **94.6%** test accuracy', zh: 对比 4 种数据增强策略，微调后的 ResNet 测试准确率 **94.6%**}
    notes: 数字来自一次验证集运行，没做交叉验证。
  - id: EXP-004
    section: skills
    title: {en: Languages, zh: 编程语言}
    tech: [Python, TypeScript, Java, C]
  - id: EXP-005
    section: skills
    title: {en: Frameworks, zh: 框架工具}
    tech: [PyTorch, scikit-learn, React, Next.js, Git]
subsets:
  # ALL is the full set: every entry, every contact, in library order (no `entries` list).
  - id: ALL
    label: 全部经历
    lang: en
    template: classic
    headline: {en: 'MSc Computer Science student', zh: 计算机硕士在读}
    layout: {}
  # Every other subset is the resume for one kind of role: some of the library's entries.
  - id: RES-TECH-EN
    label: ML 工程（英文）
    lang: en
    template: classic
    headline: {en: 'MSc Computer Science student · ML & full-stack', zh: 计算机硕士在读 · 机器学习与全栈开发}
    entries: [EXP-001, EXP-002, EXP-003, EXP-004, EXP-005]
    layout: {}
  - id: RES-TECH-ZH
    label: ML 工程（中文）
    lang: zh
    template: modern
    headline: {en: 'MSc Computer Science student · ML & full-stack', zh: 计算机硕士在读 · 机器学习与全栈开发}
    hide_contacts: [phone]
    entries: [EXP-001, EXP-002, EXP-003, EXP-004, EXP-005]
    layout: {font_size: 10.5}
